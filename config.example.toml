[vault]
mode = "per_project"        # per_project | global
project = "lts-default"     # Basic Memory project name
# path = "~/ai_memory_vault"  # vault directory (default: <project-root>/.ai_vault)
# author = "dmitrii"          # team mode: your personal session-memory namespace, must be a slug

[sleep]
pressure_warn = 0.60          # UserPromptSubmit: soft reminder threshold (fraction of window)
pressure_force = 0.80         # hard "time to /sleep" threshold
context_window = 1000000      # model context window (default fits Opus 1M; set 200000 for Sonnet)

[memory]
map_budget = 1500             # chars of "memory map" (note titles) injected on every turn; 0 = off
